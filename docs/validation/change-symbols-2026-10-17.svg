<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Arial,sans-serif"><rect width="960" height="470" fill="#f7f8f3"/><text x="25" y="38" font-size="22" fill="#283f43">Change symbols · reusable model-state marks</text><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#267950" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false" class="change-symbol" role="img" aria-label="Added object" x="25" y="70"><title >Added object · Present now and absent in the prior saved month.</title><path d="M12 4v16M4 12h16"></path></svg><text x="68" y="85" font-size="15" fill="#283f43">Added object · added</text><text x="68" y="107" font-size="10" fill="#566d64">Present now and absent in the prior saved month.</text><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#ad4c42" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false" class="change-symbol" role="img" aria-label="Removed object" x="495" y="70"><title >Removed object · Present in the prior saved month and absent now.</title><path d="M4 12h16"></path></svg><text x="538" y="85" font-size="15" fill="#283f43">Removed object · removed</text><text x="538" y="107" font-size="10" fill="#566d64">Present in the prior saved month and absent now.</text><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#a16b27" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false" class="change-symbol" role="img" aria-label="Construction started" x="25" y="160"><title >Construction started · Existing planned object changed to construction.</title><path d="M5 20V7h14M3 7h18M15 7v9M12 16h6"></path></svg><text x="68" y="175" font-size="15" fill="#283f43">Construction started · started</text><text x="68" y="197" font-size="10" fill="#566d64">Existing planned object changed to construction.</text><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#267950" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false" class="change-symbol" role="img" aria-label="Completed" x="495" y="160"><title >Completed · Existing object changed to complete since the prior saved month.</title><path d="M4 12l5 5L20 6"></path></svg><text x="538" y="175" font-size="15" fill="#283f43">Completed · completed</text><text x="538" y="197" font-size="10" fill="#566d64">Existing object changed to complete since the prior saved month.</text><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#236b88" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false" class="change-symbol" role="img" aria-label="Increase" x="25" y="250"><title >Increase · Positive difference from the prior comparable saved value.</title><path d="M12 20V4M5 11l7-7 7 7"></path></svg><text x="68" y="265" font-size="15" fill="#283f43">Increase · increase</text><text x="68" y="287" font-size="10" fill="#566d64">Positive difference from the prior comparable saved value.</text><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#ad4c42" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false" class="change-symbol" role="img" aria-label="Decrease" x="495" y="250"><title >Decrease · Negative difference from the prior comparable saved value.</title><path d="M12 4v16M5 13l7 7 7-7"></path></svg><text x="538" y="265" font-size="15" fill="#283f43">Decrease · decrease</text><text x="538" y="287" font-size="10" fill="#566d64">Negative difference from the prior comparable saved value.</text><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#68747b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false" class="change-symbol" role="img" aria-label="Unchanged" x="25" y="340"><title >Unchanged · Comparable saved value or state is unchanged.</title><path d="M5 9h14M5 15h14"></path></svg><text x="68" y="355" font-size="15" fill="#283f43">Unchanged · unchanged</text><text x="68" y="377" font-size="10" fill="#566d64">Comparable saved value or state is unchanged.</text><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#68747b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" focusable="false" class="change-symbol" role="img" aria-label="Not comparable" x="495" y="340"><title >Not comparable · Missing value or no prior comparable saved month; not zero.</title><path d="M8 7a4 4 0 0 1 8 0c0 3-4 3-4 6M12 18v1"></path></svg><text x="538" y="355" font-size="15" fill="#283f43">Not comparable · unavailable</text><text x="538" y="377" font-size="10" fill="#566d64">Missing value or no prior comparable saved month; not zero.</text><text x="25" y="455" font-size="13" fill="#566d64">Always pair with metric, unit, date and comparison. A change symbol does not imply policy benefit.</text></svg>